{% extends 'base.html' %}
{% load static %}
{% block title %}
  My stored posts
{% endblock %}

{% block css_files %}
  <link rel="stylesheet" href="{% static 'blog/stored-posts.css' %}" />
{% endblock %}

{% block content %}
  <section id="stored-posts">
    {% if not has_posts %}
      <p>You didn't save any posts for later.</p>
    {% endif %}
    <ul>
      <li>
        {% for post in posts %}
          <a href="{% url 'post-detail-page' post.slug %}">{{ post.title }}</a>
        {% endfor %}
      </li>
    </ul>
  </section>
{% endblock %}
